<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>20万内家用车全览 · 落地价计算器</title>
<style>
:root{
  --bg:#0D1117; --card:#17171E; --card2:#1D1D26; --line:#2C2C36;
  --primary:#D0BCFF; --fg:#E6E0E9; --muted:#9AA6B2; --faint:#6B7683;
  --ok:#7BD88F; --warn:#FFB86B;
  --grad:linear-gradient(135deg,#53389E 0%,#3B6FD4 100%);
  --r:22px; --r-sm:14px;
  --shadow:0 8px 28px rgba(0,0,0,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:64px;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

.hero{background:var(--grad);position:relative;overflow:hidden;padding:28px 0 22px;border-radius:0 0 28px 28px}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 90% -20%,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:25px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.hero .sub{font-size:13px;color:rgba(255,255,255,.82);margin-top:6px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .meta span{font-size:11.5px;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.16);color:#fff}

.locbar{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  margin-top:-14px;position:relative;z-index:2;box-shadow:var(--shadow)}
.locbar .ic{width:34px;height:34px;border-radius:12px;background:rgba(208,188,255,.14);
  display:grid;place-items:center;flex:0 0 auto}
.locbar .ic svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:1.8}
.locbar .txt{flex:1;min-width:0}
.locbar .txt b{display:block;font-size:14.5px;font-weight:600}
.locbar .txt small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locbar select{background:var(--card2);color:var(--fg);border:1px solid var(--line);
  border-radius:999px;padding:8px 12px;font-size:13px;outline:none;max-width:150px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-top:16px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-title h2{font-size:16px;font-weight:700}
.card-title small{font-size:11.5px;color:var(--muted)}

.filters{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:8px 14px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted);
  transition:.18s;user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{background:rgba(208,188,255,.16);border-color:rgba(208,188,255,.55);
  color:var(--primary);font-weight:600}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row label{font-size:13px;color:var(--muted);flex:0 0 auto}
.slider-row output{font-size:14px;font-weight:700;color:var(--primary);
  flex:0 0 auto;min-width:66px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;
  border-radius:2px;background:linear-gradient(90deg,var(--primary) var(--pct,100%),#2C2C36 var(--pct,100%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:var(--primary);border:3px solid #17171E;box-shadow:0 0 0 1px var(--primary)}
select.sel{width:100%;background:var(--card2);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 13px;font-size:14px;outline:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}
.stat b{display:block;font-size:17px;font-weight:800;color:var(--primary)}
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 0;font-size:14px;font-weight:600}
.acc-head .chev{margin-left:auto;transition:.22s;color:var(--muted);font-size:16px}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-body{display:none;padding:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.7}
.acc.open .acc-body{display:block}
.acc-body strong{color:var(--fg)}
.acc-body ul{margin:6px 0 0;padding-left:18px}
.acc-body li{margin:3px 0}

/* ---------- 图片跳转 ---------- */
.pic-links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pic-link{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;
  border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);
  border:1px solid var(--line);color:var(--muted);text-decoration:none;transition:.16s}
.pic-link:active{transform:scale(.95);background:#242430}
.pic-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.pic-link.baidu{color:#5AA0E0;border-color:rgba(90,160,224,.35);background:rgba(90,160,224,.10)}
.pic-link.so360{color:#4CD07D;border-color:rgba(76,208,125,.35);background:rgba(76,208,125,.10)}
.car-link-mini{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--primary);margin-top:6px;text-decoration:none;padding:3px 8px;
  border-radius:999px;background:rgba(208,188,255,.10);
  border:1px solid rgba(208,188,255,.25)}
.car-link-mini:active{transform:scale(.95)}
.car-link-mini svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}

.hero-car-link{display:block;position:relative;text-decoration:none;border-radius:16px;overflow:hidden;transition:.18s;cursor:pointer}
.hero-car-link:active{transform:scale(.985);background:rgba(208,188,255,.06)}
.hero-car-hint{position:absolute;right:10px;bottom:10px;font-size:11.5px;padding:5px 12px;border-radius:999px;background:rgba(208,188,255,.22);color:var(--primary);border:1px solid rgba(208,188,255,.45);font-weight:600}
.pic-link.sogou{color:#F07C7C;border-color:rgba(240,124,124,.35);background:rgba(240,124,124,.10)}
.cfg-group{margin-bottom:16px}
.cfg-group-title{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cfg-group-title::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--primary)}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.metric .k{font-size:11px;color:var(--muted);line-height:1.4}
.metric .v{font-size:13.5px;font-weight:600;color:var(--fg);margin-top:3px;line-height:1.4;word-break:break-word}
@media (max-width:400px){.metric-grid{grid-template-columns:1fr}}
.official-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px 16px;border-radius:999px;background:var(--grad);color:#fff;text-decoration:none;font-size:14px;font-weight:600;transition:.18s}
.official-btn:active{transform:scale(.97);filter:brightness(.95)}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.car{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;transition:.18s}
.car:active{transform:scale(.985);background:var(--card2);border-color:rgba(208,188,255,.35)}
.car-thumb{flex:0 0 104px;height:74px;border-radius:var(--r-sm);
  background:linear-gradient(160deg,#20202B,#15151C);border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden}
.car-thumb svg{width:100%;height:100%}
.car-main{flex:1;min-width:0}
.car-top{display:flex;align-items:center;gap:8px}
.car-top h3{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;padding:2px 8px;border-radius:999px;flex:0 0 auto;font-weight:600;
  background:rgba(208,188,255,.14);color:var(--primary);border:1px solid rgba(208,188,255,.3)}
.pill.fuel{background:rgba(255,184,107,.13);color:var(--warn);border-color:rgba(255,184,107,.3)}
.pill.ev{background:rgba(123,216,143,.13);color:var(--ok);border-color:rgba(123,216,143,.3)}
.car-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.dots{display:flex;gap:5px;margin-top:9px}
.dots i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.22)}
.car-price{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.car-price .lp{font-size:16px;font-weight:800;color:var(--primary)}
.car-price .msrp{font-size:11.5px;color:var(--faint);text-decoration:line-through}
.car-price .save{font-size:11px;color:var(--ok)}

.empty{text-align:center;padding:44px 20px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:16px}
.empty b{display:block;font-size:15px;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13px}
.btn-pill{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--primary);color:#1A1030;transition:.18s}
.btn-pill:active{transform:scale(.96);filter:brightness(.92)}
.btn-ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-size:13.5px;transition:.18s}
.btn-ghost:active{transform:scale(.96);background:#242430}

.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;top:24px;background:var(--bg);
  border-radius:26px 26px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:up .26s cubic-bezier(.2,.8,.3,1);padding-bottom:40px}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px;background:rgba(13,17,23,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.sheet-bar h2{font-size:16px;font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--card2);
  border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.icon-btn svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}

.hero-car{background:linear-gradient(160deg,#1E1E2A,#141420);
  border-bottom:1px solid var(--line);padding:18px 16px 20px}
.hero-car svg{width:100%;max-height:170px;display:block}
.hero-name{font-size:20px;font-weight:800;margin-top:12px}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero-tags span{font-size:11px;padding:3px 10px;border-radius:999px;
  background:rgba(208,188,255,.12);color:var(--primary)}

.sec{padding:18px 16px 0}
.sec h3{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.4px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--primary)}

.ver-item{display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  transition:.16s;width:100%;text-align:left}
.ver-item:active{transform:scale(.98)}
.ver-item.on{border-color:var(--primary);background:rgba(208,188,255,.09)}
.ver-item .vn{flex:1;font-size:14px;font-weight:600}
.ver-item .vp{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.ver-item.on .vp{color:var(--primary)}

.money{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.money .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;
  padding:7px 0;color:var(--muted)}
.money .row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.money .row.minus b{color:var(--ok)}
.money .tot{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:13px;border-top:1px dashed var(--line)}
.money .tot span{font-size:13.5px;color:var(--muted)}
.money .tot b{font-size:24px;font-weight:800;color:var(--primary);letter-spacing:-.8px}
.money .note{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}

table.cfg{width:100%;border-collapse:collapse;font-size:13.5px}
table.cfg tr{border-bottom:1px solid var(--line)}
table.cfg tr:last-child{border-bottom:0}
table.cfg th{text-align:left;font-weight:500;color:var(--muted);padding:9px 0;
  width:38%;vertical-align:top;font-size:13px}
table.cfg td{padding:9px 0;color:var(--fg);font-weight:500}

.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc > div{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:13px 14px}
.pc h4{font-size:12px;font-weight:700;margin-bottom:8px}
.pc.good h4{color:var(--ok)}
.pc.bad h4{color:var(--warn)}
.pc ul{margin:0;padding:0;list-style:none}
.pc li{font-size:12.5px;color:var(--muted);line-height:1.65;
  padding-left:12px;position:relative}
.pc li::before{content:"";position:absolute;left:0;top:9px;
  width:4px;height:4px;border-radius:50%}
.pc.good li::before{background:var(--ok)}
.pc.bad li::before{background:var(--warn)}

.rev{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:13px 14px;margin-bottom:9px}
.rev .rt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rev .who{font-size:12.5px;font-weight:600}
.rev .st{font-size:11px;color:var(--warn);letter-spacing:1px}
.rev p{font-size:13px;color:var(--muted);line-height:1.65}
.disclaim{font-size:11.5px;color:var(--faint);line-height:1.7;padding:20px 16px 0}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:#2A2A36;color:var(--fg);border:1px solid var(--line);
  padding:11px 20px;border-radius:999px;font-size:13px;z-index:99;
  opacity:0;pointer-events:none;transition:.26s;box-shadow:var(--shadow);
  max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;font-size:11.5px;color:var(--faint);
  padding:26px 16px 10px;line-height:1.8}

@media (max-width:400px){
  .hero h1{font-size:22px}
  .car-thumb{flex:0 0 86px;height:64px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .pc{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>20万以内 · 家用车全览</h1>
    <p class="sub">油车 / 纯电 / 插混 / 增程 · 全版本落地价实时测算</p>
    <div class="meta">
      <span id="heroLoc">江西 · 上饶市广信区</span>
      <span id="heroCount">138 款在售</span>
      <span style="background:rgba(123,216,143,.22);border:1px solid rgba(123,216,143,.5);font-weight:700">v10.30 新版</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="locbar">
    <div class="ic">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
    </div>
    <div class="txt">
      <b>购车地</b>
      <small id="locNote">补贴与上牌费按所选地区测算</small>
    </div>
    <select id="locSel" aria-label="选择购车地区"></select>
  </div>

  <section class="card">
    <div class="card-title">
      <h2>筛选与测算</h2>
      <small id="resCount">—</small>
    </div>
    <div class="filters">
      <div class="chips" id="typeChips">
        <button class="chip on" data-type="all">全部</button>
        <button class="chip" data-type="燃油">燃油</button>
        <button class="chip" data-type="插混">插混</button>
        <button class="chip" data-type="纯电">纯电</button>
        <button class="chip" data-type="增程">增程</button>
      </div>
      <div class="slider-row">
        <label for="budget">落地预算</label>
        <input type="range" id="budget" min="6" max="20" step="0.5" value="20">
        <output id="budgetOut">20 万</output>
      </div>
      <select class="sel" id="tradeSel" aria-label="以旧换新方式">
        <option value="none">不参与以旧换新</option>
        <option value="swap">置换更新（旧车卖掉 / 过户）</option>
        <option value="scrap">报废更新（旧车报废注销）</option>
      </select>
      <select class="sel" id="sortSel" aria-label="排序方式">
        <option value="lp">按落地价 从低到高</option>
        <option value="msrp">按指导价 从低到高</option>
        <option value="brand">按品牌分组</option>
      </select>
      <div class="stat-grid">
        <div class="stat"><b id="stMin">—</b><small>最低落地</small></div>
        <div class="stat"><b id="stSub">—</b><small>可拿补贴</small></div>
        <div class="stat"><b id="stCnt">—</b><small>符合预算</small></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>2026 购车政策 · 上饶可享</h2>
      <small>点击展开</small>
    </div>
    <div id="policyBox"></div>
  </section>

  <div class="list" id="list"></div>
  <div id="emptyBox"></div>

  <div style="display:flex;gap:10px;margin-top:20px">
    <button class="btn-ghost" id="btnExport" style="flex:1">导出当前测算 JSON</button>
    <button class="btn-ghost" id="btnReset" style="flex:1">重置筛选</button>
  </div>
</div>

<footer>
  数据整理于 2026 年 10 月，指导价为厂商建议零售价，终端优惠为市场行情估算。<br>
  落地价含购置税、保险、上牌等估算项，实际以门店开票为准。<br>
  补贴标准以国家及江西省、上饶市商务部门最新公告为准。
</footer>

<div class="sheet" id="sheet">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast"></div>
<script>
const LOCATIONS = [
  {id:'sr', name:'江西 · 上饶市广信区', plate:'赣E', localSub:0.30, plateFee:0.05,
   note:'广信区购车可叠加市级消费券，需在上饶国际汽车城（旭日北大道）备案门店开票'},
  {id:'nc', name:'江西 · 南昌市', plate:'赣A', localSub:0.35, plateFee:0.05,
   note:'南昌市级消费券叠加，部分区县另有加码'},
  {id:'gz', name:'江西 · 赣州市', plate:'赣B', localSub:0.25, plateFee:0.05,
   note:'赣州市级补贴按季度发放，先到先得'},
  {id:'hz', name:'浙江 · 杭州市', plate:'浙A', localSub:0.50, plateFee:0.06,
   note:'杭州置换补贴额度较高，需浙A指标或新能源专用牌'},

const isNEV = t => t !== '燃油';

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('on'), 2000);
}

function calcLanding(car, ver, s){
  const loc = LOC_MAP[s.loc] || LOC_MAP.sr;
  const nev = isNEV(car.type);
  const msrp = ver.msrp;
  const bare = msrp * (1 - car.discount);
  const tax = nev ? bare / 1.13 * 0.05 : bare / 1.13 * 0.10;
  const jq = 0.095;
  const ccs = nev ? 0 : 0.042;
  const biz = Math.max(0.32, bare * (nev ? 0.036 : 0.032));
  const plate = loc.plateFee;
  let sub = 0;
  if(s.trade === 'scrap') sub += nev ? 2.0 : 1.5;
  else if(s.trade === 'swap') sub += nev ? 1.5 : 1.3;
  sub += loc.localSub;
  const total = bare + tax + jq + ccs + biz + plate - sub;
  return {bare, tax, jq, ccs, biz, plate, sub, total, msrp};
}

function lowestLanding(car, s){
  const sorted = [...car.versions].sort((a,b)=>a.msrp-b.msrp);
  return calcLanding(car, sorted[0], s);
}

function getFiltered(){
  let arr = CARS.filter(c=>{
    if(state.type !== 'all' && c.type !== state.type) return false;
    return lowestLanding(c, state).total <= state.budget;
  });
  if(state.sort === 'lp'){
    arr.sort((a,b)=> lowestLanding(a,state).total - lowestLanding(b,state).total);
  } else if(state.sort === 'msrp'){
    arr.sort((a,b)=> a.msrp[0] - b.msrp[0]);
  } else {
    arr.sort((a,b)=> a.brand.localeCompare(b.brand,'zh') || a.msrp[0]-b.msrp[0]);
  }
  return arr;
}

function renderList(){
  const arr = getFiltered();
  const list = $('#list');
  const empty = $('#emptyBox');

  if(!arr.length){
    list.innerHTML = '';

      state.budget = 20; $('#budget').value = 20; syncBudget(); refresh();

  }
  empty.innerHTML = '';

  list.innerHTML = arr.map(c=>{
    const low = lowestLanding(c, state);
    const cls = c.type === '燃油' ? 'fuel' : (c.type === '纯电' ? 'ev' : '');

function refresh(){
  const loc = LOC_MAP[state.loc];
  $('#heroLoc').textContent = loc.name;
  $('#heroCount').textContent = CARS.length + ' 款在售';
  $('#locNote').textContent = loc.note;

  const arr = getFiltered();
  $('#resCount').textContent = arr.length + ' 款符合';
  $('#stCnt').textContent = arr.length + ' 款';
  const allLow = CARS.map(c=>lowestLanding(c,state).total);
  $('#stMin').textContent = fmt(Math.min(...allLow)) + '万';
  const subSample = calcLanding(CARS[0], CARS[0].versions[0], state).sub;

function syncBudget(){
  const v = parseFloat($('#budget').value);
  state.budget = v;
  $('#budgetOut').textContent = v + ' 万';
  const pct = (v - 6) / (20 - 6) * 100;
  $('#budget').style.setProperty('--pct', pct + '%');
}

let sheetCar = null;
let sheetVerIdx = 0;
let sheetColorIdx = 0;

function openSheet(id){
  try {
    const car = CARS.find(c=>c && c.id===id);
    if(!car){ console.log('openSheet: 找不到车辆', id); return; }
    sheetCar = car;
    sheetVerIdx = 0;

    renderSheet();
    $('#sheet').classList.add('on');
    document.body.style.overflow = 'hidden';
    $('#sheetBody').scrollTop = 0;

    console.error('openSheet 出错:', err);

function closeSheet(){
  $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
}


// 参数分组渲染（普通函数，避免嵌套模板字符串）
function cfgHtml(cfg, carType){
  // 三套模板
  const EV = {  // 纯电
    groups: [
      {t:'电机与电池', keys:['电机型号','电机功率','电机扭矩','电池类型','电池容量','三电质保','快充']},
      {t:'续航与驱动', keys:['纯电续航','驱动方式','变速箱']},
      {t:'车身与底盘', keys:['车身尺寸','轴距','悬架','轮胎规格','整备质量','后备厢','安全气囊']},
      {t:'座舱与智驾', keys:['中控屏','智驾辅助']}
    ]
  };
  const PHEV = {  // 插混 / 增程：双动力
    groups: [
      {t:'发动机', keys:['发动机','发动机型号','最大马力','最大扭矩']},
      {t:'电机与电池', keys:['电机型号','电机功率','电机扭矩','电池类型','电池容量','三电质保']},
      {t:'续航与能耗', keys:['纯电续航','综合续航','亏电油耗','快充']},
      {t:'传动与驱动', keys:['变速箱','驱动方式']},
      {t:'车身与底盘', keys:['车身尺寸','轴距','悬架','轮胎规格','整备质量','后备厢','安全气囊']},
      {t:'座舱与智驾', keys:['中控屏','智驾辅助']}
    ]
  };
  const ICE = {  // 燃油 / 混动
    groups: [
      {t:'动力系统', keys:['发动机','发动机型号','最大功率','最大马力','最大扭矩','变速箱','驱动方式','综合油耗']},
      {t:'车身与底盘', keys:['车身尺寸','轴距','悬架','轮胎规格','整备质量','后备厢','安全气囊']},
      {t:'座舱与智驾', keys:['中控屏','智驾辅助']}
    ]
  };
  let tpl = ICE;
  if (carType === '纯电') tpl = EV;
  else if (carType === '插混' || carType === '增程') tpl = PHEV;

  const used = {};
  let out = '';
  for (let i = 0; i < tpl.groups.length; i++) {
    const g = tpl.groups[i];
    let items = '';
    for (let j = 0; j < g.keys.length; j++) {
      const k = g.keys[j];
      if (cfg && cfg[k]) {
        used[k] = 1;
        items += '<div class="metric"><div class="k">' + k + '</div><div class="v">' + cfg[k] + '</div></div>';
      }
    }
    if (items) out += '<div class="cfg-group"><div class="cfg-group-title">' + g.t + '</div><div class="metric-grid">' + items + '</div></div>';
  }
  // 未归类的字段也显示出来（防止遗漏）
  let rest = '';
  for (const k in cfg) {
    if (!used[k]) rest += '<div class="metric"><div class="k">' + k + '</div><div class="v">' + cfg[k] + '</div></div>';
  }
  if (rest) out += '<div class="cfg-group"><div class="cfg-group-title">其他参数</div><div class="metric-grid">' + rest + '</div></div>';
  return out;
}

function bindEvents(){
  $('#typeChips').addEventListener('click', e=>{
    const btn = e.target.closest('[data-type]');
    if(!btn) return;
    state.type = btn.dataset.type;
    document.querySelectorAll('#typeChips .chip').forEach(c=>c.classList.toggle('on', c===btn));
    refresh();
  });
  $('#budget').addEventListener('input', ()=>{ syncBudget(); refresh(); });
  $('#tradeSel').value = state.trade;
  $('#tradeSel').addEventListener('change', e=>{
    state.trade = e.target.value;
    localStorage.setItem('cc_trade', state.trade);
    refresh();
    toast(state.trade === 'none' ? '已取消以旧换新测算'
      : (state.trade === 'scrap' ? '按报废更新测算，已计入国补' : '按置换更新测算，已计入补贴'));
  });
  $('#sortSel').addEventListener('change', e=>{ state.sort = e.target.value; refresh(); });
  $('#btnReset').addEventListener('click', ()=>{
    state.budget = 20; state.type = 'all'; state.sort = 'lp'; state.trade = 'none';
    $('#budget').value = 20; $('#tradeSel').value = 'none'; $('#sortSel').value = 'lp';
    document.querySelectorAll('#typeChips .chip').forEach(c=>c.classList.toggle('on', c.dataset.type==='all'));
    syncBudget(); refresh(); toast('已重置筛选条件');
  });
  $('#btnExport').addEventListener('click', exportJSON);
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeSheet(); });
}

function exportJSON(){
  const loc = LOC_MAP[state.loc];
  const data = {

    购车地: loc.name,
    以旧换新: state.trade === 'none' ? '不参与' : (state.trade === 'scrap' ? '报废更新' : '置换更新'),
    预算上限万元: state.budget,
    车型: getFiltered().map(c=>{
      const rows = c.versions.map(v=>{
        const m = calcLanding(c, v, state);
        return { 版本:v.name, 指导价:v.msrp, 裸车价:+fmt(m.bare), 购置税:+fmt(m.tax),
                 商业险:+fmt(m.biz), 补贴:+fmt(m.sub), 预估落地:+fmt(m.total) };
      });
      return { 品牌:c.brand, 车型:c.name, 年款:c.year, 能源类型:c.type, 车身:c.body,
               指导价区间:c.msrp, 颜色:c.colors.map(x=>x.n), 优势:c.pros, 短板:c.cons, 版本明细:rows };
    })
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `购车测算_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
  toast('已导出 JSON 到下载目录');
}

(function init(){
  initLocSelect();
  renderPolicy();
  bindEvents();
  syncBudget();
  refresh();
})();
</script>
</body>
</html>
